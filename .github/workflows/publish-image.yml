name: Publish immutable image

on:
  workflow_dispatch:
    inputs:
      confirm-publication:
        description: Confirm owner-approved publication of this validated commit only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_build-and-test.yml

  publish:
    needs: validate
    if: ${{ inputs.confirm-publication == true && vars.LEGACY_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/.github/workflows/publish-image.yml@73dd7304ffe85ec504389fd7664cc39070b9f148
    with:
      image: ${{ vars.LEGACY_ARTIFACT_REGISTRY }}/legacy-maliev-notification-service
      dockerfile: Legacy.Maliev.NotificationService.Api/Dockerfile
      context: .
      environment: legacy-production
      workload-identity-provider: ${{ vars.LEGACY_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.LEGACY_NOTIFICATION_PUBLISHER_SERVICE_ACCOUNT }}
