name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/runner-results
    steps:
      - name: Check out NotificationService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7edcd961024868513fd5f373cab3dcb261197f77
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out the actual Accounting consumer fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AccountingService
          ref: a0e65818cd33ef1cdf71227bbc37f6df638d9fab
          path: .dependencies/Legacy.Maliev.AccountingService
          persist-credentials: false
      - name: Check out the actual Intranet BFF consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.Intranet
          ref: cda7e5f6817e9462f058eaf6638da58c27e75024
          path: .dependencies/Legacy.Maliev.Intranet
          persist-credentials: false
      - name: Verify exact BFF consumer before compilation
        run: python3 scripts/verify-order-notification-consumer.py .dependencies/Legacy.Maliev.Intranet
      - name: Preload unchanged PostgreSQL test image
        timeout-minutes: 6
        run: |
          python3 -m unittest discover -s scripts -p test_preload_postgres_image.py -v
          python3 scripts/preload-postgres-image.py
      - name: Check out reviewed resource guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.Workflows
          ref: 7a449b36fe5f4f7b9e436d2c6063321480aa4a3f
          path: .dependencies/Legacy.Maliev.Workflows
          persist-credentials: false
          sparse-checkout: |
            scripts/Invoke-JwtSigningResourceScan.ps1
            scripts/JwtSigningResourceScanner.ps1
          sparse-checkout-cone-mode: 'false'
      - name: Scan tracked JWT and provider resources
        timeout-minutes: 2
        shell: pwsh
        run: |-
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:GITHUB_WORKSPACE '.dependencies/Legacy.Maliev.Workflows/scripts'
          foreach ($name in @('Invoke-JwtSigningResourceScan.ps1', 'JwtSigningResourceScanner.ps1')) {
              if (-not (Test-Path -LiteralPath (Join-Path $tools $name) -PathType Leaf)) {
                  [Console]::Error.WriteLine('[jwt-resource-scan] FAILED: trusted scanner unavailable; details redacted')
                  exit 1
              }
          }
          & (Join-Path $tools 'Invoke-JwtSigningResourceScan.ps1') -RepositoryPath $env:GITHUB_WORKSPACE
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@73dd7304ffe85ec504389fd7664cc39070b9f148
        with:
          solution: Legacy.Maliev.NotificationService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Prove legacy attachment filename correction causally
        timeout-minutes: 20
        run: |-
          python3 -B -m unittest discover -s scripts -p test_prove_attachment_name.py
          python3 -B scripts/prove_attachment_name.py runner-results
      - name: Gate owned production coverage
        run: python3 scripts/verify-runner-coverage.py runner-results
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notification-validation-${{ github.sha }}
          path: runner-results
          if-no-files-found: warn
          retention-days: 7
